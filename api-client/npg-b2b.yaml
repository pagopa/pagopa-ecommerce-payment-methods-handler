openapi: 3.0.0
info:
  title: NPG Build Integrity API
  description: Nexi Payment Gateway B2B API for SDK build integrity check
  version: 1.0.0
servers:
  - url: https://stg-ta.nexigroup.com
    description: DEV/UAT
  - url: https://xpay.nexigroup.com
    description: PROD
paths:
  /api/phoenix-0.0/psp/api/v1/build/integrity:
    get:
      tags:
        - NpgBuildIntegrity
      operationId: getBuildIntegrity
      summary: Get SDK build integrity hash
      parameters:
        - name: Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Build integrity information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildIntegrityResponse'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
components:
  schemas:
    BuildIntegrityResponse:
      type: object
      properties:
        integrity:
          type: string
          description: SHA-384 integrity hash for the SDK script
