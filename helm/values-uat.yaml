microservice-chart:
  namespace: "ecommerce"
  nameOverride: "b-pagopa-ecommerce-payment-methods-handler"
  fullnameOverride: "b-pagopaecommercepaymentmethodshandler"
  image:
    repository: pagopaucommonacr.azurecr.io/pagopaecommercepaymentmethodshandler
    tag: "1.6.0"
    pullPolicy: Always
  livenessProbe:
    handlerType: httpGet
    httpGet:
      path: /q/health/live
      port: 8080
    initialDelaySeconds: 2
    failureThreshold: 6
    periodSeconds: 3
  readinessProbe:
    handlerType: httpGet
    httpGet:
      path: /q/health/ready
      port: 8080
    initialDelaySeconds: 2
    failureThreshold: 6
    periodSeconds: 3
  deployment:
    create: true
    replicas: 3
  service:
    create: true
    type: ClusterIP
    ports:
      - 8080
  ingress:
    create: true
    host: "weuuat.ecommerce.internal.uat.platform.pagopa.it"
    path: /beta/pagopa-ecommerce-payment-methods-handler/(.*)
    servicePort: 8080
  serviceAccount:
    name: "ecommerce-workload-identity"
  podAnnotations: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - all
  resources:
    requests:
      memory: "128Mi"
      cpu: "150m"
    limits:
      memory: "128Mi"
      cpu: "150m"
  autoscaling:
    enable: true
    minReplica: 3
    maxReplica: 10
    pollingInterval: 30 # seconds
    cooldownPeriod: 300 # seconds
    triggers:
      - type: cpu
        metadata:
          # Required
          type: Utilization # Allowed types are 'Utilization' or 'AverageValue'
          value: "70"
  envConfig:
    ROOT_LOG_LEVEL: INFO
    OTEL_RESOURCE_ATTRIBUTES: "service.name=pagopa-ecommerce-payment-methods-handler-blue,deployment.environment=uat"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.elastic-system.svc:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_LOGS_EXPORTER: none
    OTEL_TRACES_SAMPLER: "always_on"
    ECS_SERVICE_NAME: pagopa-ecommerce-payment-methods-handler-blue
    ECS_SERVICE_ENVIRONMENT: uat
    SECURITY_API_KEY_SECURED_PATHS: "/_none"
    AFM_URI_V1: "https://api.uat.platform.pagopa.it/ecommerce/mock/gec/v1"
    AFM_URI_V2: "https://api.uat.platform.pagopa.it/ecommerce/mock/gec/v2"
    AFM_CONNECTION_TIMEOUT: "10000"
    AFM_READ_TIMEOUT: "10000"
    NPG_B2B_URI: "https://api.uat.platform.pagopa.it/ecommerce/mock/npg/v1"
    NPG_B2B_CONNECTION_TIMEOUT: "5000"
    NPG_B2B_READ_TIMEOUT: "10000"
    NPG_URI: "https://api.uat.platform.pagopa.it/ecommerce/mock/npg/v1"
    NPG_CONNECTION_TIMEOUT: "10000"
    NPG_READ_TIMEOUT: "10000"
    NPG_SESSIONS_TTL: "600"
    NPG_NOTIFICATION_JWT_VALIDITY_TIME: "900"
    SESSION_URL_BASE_PATH: "https://uat.checkout.pagopa.it"
    SESSION_URL_IO_BASE_PATH: "https://uat.checkout.pagopa.it"
    SESSION_URL_OUTCOME_SUFFIX: "/esito"
    SESSION_URL_CANCEL_SUFFIX: "/annulla"
    SESSION_URL_NOTIFICATION_URL: "https://api.uat.platform.pagopa.it/ecommerce/checkout/v1/notifications/npg/{orderId}/{sessionToken}"
    JWT_ISSUER_URI: "https://weuuat.ecommerce.internal.uat.platform.pagopa.it/pagopa-jwt-issuer-service"
    JWT_ISSUER_READ_TIMEOUT: "10000"
    JWT_ISSUER_CONNECTION_TIMEOUT: "10000"
    REDIS_PORT: "6380"
  envSecret:
    SECURITY_API_KEY_PRIMARY: ecommerce-payment-methods-primary-api-key
    SECURITY_API_KEY_SECONDARY: ecommerce-payment-methods-secondary-api-key
    AFM_KEY: ecommerce-load-test-subscription-key
    NPG_API_KEY: npg-api-key
    JWT_ISSUER_API_KEY: ecommerce-jwt-issuer-service-active-api-key
    REDIS_HOST: redis-ecommerce-hostname
    REDIS_PASSWORD: redis-ecommerce-access-key
  keyvault:
    name: "pagopa-u-ecommerce-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"
  nodeSelector: {}
  tolerations: []
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node_type
                operator: In
                values:
                  - user
  secretProviderClass:
    create: true
  azure:
    workloadIdentityClientId: "449c5b65-f368-487a-881a-b03676420c53"
